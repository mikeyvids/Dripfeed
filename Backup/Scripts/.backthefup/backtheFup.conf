# Back the Files Up v1.4.1 — settings only. Archive contents are fixed in the
# engine so configuration cannot accidentally add ROMs or unrelated media.
BACKUP_DIR=/media/fat/_Backups
KEEP_LIVE=8
KEEP_PROFILER=8

# One shared destination for this MiSTer and every Profiler profile.
BACKUP_SCOPE=all-profiles
RCLONE_REMOTE=
RCLONE_LIVE_DIR=live
RCLONE_PROFILER_DIR=profiler
